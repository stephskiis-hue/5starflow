<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:var(--font-sans)}
.post.size-story{height:1920px}.post.size-square{height:1080px}
.mark{display:flex;align-items:center;gap:16px}
.badge{width:64px;height:64px;border-radius:var(--radius-badge);display:block}
.wm{font-family:var(--font-display);font-size:34px;letter-spacing:1px;line-height:1}
.wm small{display:block;font-family:var(--font-sans);font-weight:600;font-size:14px;letter-spacing:4px;opacity:.75;margin-top:6px}

.post{background:var(--forest);color:var(--white);display:flex;flex-direction:column}
.photo{flex:none;height:540px;position:relative;background-color:var(--forest-stripe-a);background-image:repeating-linear-gradient(90deg,#3e6b35 0 45px,#5c8f47 45px 90px);background-size:cover;background-position:center}
.flag{position:absolute;right:var(--safe-statement);bottom:-30px;background:var(--leaf);color:var(--leaf-ink);font-weight:800;font-size:22px;letter-spacing:5px;padding:18px 24px}
.panel{flex:1;display:flex;flex-direction:column;padding:62px var(--safe-statement) 44px;min-height:0}
.kick{font-weight:800;letter-spacing:6px;color:var(--leaf);font-size:22px}
h1{font-family:var(--font-display);font-weight:400;font-size:118px;line-height:.9;margin-top:var(--gap-s);text-transform:uppercase}
h1 span{color:var(--leaf)}
ul{list-style:none;margin-top:30px}
li{font-size:30px;line-height:1.3;color:var(--sage);padding-left:30px;position:relative;margin-top:10px}
li::before{content:"";position:absolute;left:0;top:.4em;width:13px;height:13px;background:var(--leaf)}
.bar{margin-top:auto;background:var(--leaf);color:var(--leaf-ink);display:flex;justify-content:space-between;align-items:center;padding:24px 32px}
.bar span{font-weight:800;font-size:22px;letter-spacing:5px}
.bar b{font-family:var(--font-display);font-weight:400;font-size:62px;line-height:1;letter-spacing:1px}
.foot{display:flex;justify-content:space-between;align-items:center;padding-top:28px}
.site{font-weight:600;font-size:18px;letter-spacing:3px;color:var(--sage)}
.size-story .photo{height:820px}
.size-story .panel{padding-bottom:300px}
.size-story h1{font-size:136px}
.size-story li{font-size:34px}
.size-square .photo{height:390px}
.size-square .panel{padding:48px 64px 32px}
.size-square h1{font-size:86px}
.size-square ul{margin-top:18px}
.size-square li{font-size:25px;margin-top:6px}
.size-square .bar{padding:18px 26px}
.size-square .bar b{font-size:50px}
.size-square .foot{padding-top:18px}</style>
<div class="post">
<div class="photo" data-slot-bg="photo"><div class="flag" data-if="flag" data-slot="flag">SPOTS FILLING UP</div></div>
<div class="panel">
<div class="kick" data-slot="kicker">FALL CLEANUP · WINNIPEG</div>
<h1 data-slot="headline" data-fit>Leaves down.<br><span>Lawn ready.</span></h1>
<ul data-slot-list="points"><li>Full leaf cleanup and haul away</li><li>Last cut and edging</li><li>Beds cleared for winter</li></ul>
<div class="bar"><span data-slot="cta_label" data-default>CALL OR TEXT</span><b>204-900-0438</b></div>
<div class="foot"><div class="mark"><img class="badge" src="/_blob/8a3342d2750849e38f3090d481e356a8" alt=""><div class="wm">No-Bs Yardwork<small>WINNIPEG · EST. 2019</small></div></div><div class="site">NO-BS-YARDWORK.COM</div></div>
</div></div>
