<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:var(--font-sans)}
.post.size-story{height:1920px}.post.size-square{height:1080px}
.mark{display:flex;align-items:center;gap:16px}
.badge{width:64px;height:64px;border-radius:var(--radius-badge);display:block}
.wm{font-family:var(--font-display);font-size:34px;letter-spacing:1px;line-height:1}
.wm small{display:block;font-family:var(--font-sans);font-weight:600;font-size:14px;letter-spacing:4px;opacity:.75;margin-top:6px}

.post{background:var(--paper);color:var(--ink)}
.pic{position:absolute;left:50%;top:250px;transform:translateX(-50%);width:150px;height:150px;border-radius:var(--radius-photo);background:repeating-linear-gradient(90deg,#3e6b35 0 25px,#5c8f47 25px 50px);background-size:cover;background-position:center}
.c{position:absolute;left:var(--safe-print);right:var(--safe-print);bottom:var(--safe-print)}
h1{font-family:var(--font-serif);font-weight:400;font-size:108px;line-height:1.02;letter-spacing:-1px}
p{font-size:28px;line-height:1.5;margin-top:var(--gap-m);color:var(--muted);columns:2;column-gap:48px}
.foot{margin-top:64px;display:flex;justify-content:space-between;align-items:center;color:var(--forest);border-top:1px solid var(--rule-on-light);padding-top:var(--gap-m)}
.cta{font-weight:800;font-size:24px;letter-spacing:1px}
.pic[style*="url("]{width:240px;height:240px;top:200px}
.size-story .pic{top:420px;width:200px;height:200px}
.size-story .c{bottom:300px}
.size-square .pic{top:130px}
.size-square h1{font-size:92px}
.size-square p{font-size:25px}
.size-square .foot{margin-top:44px}</style>
