<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.post{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:var(--font-sans)}
.mark{display:flex;align-items:center;gap:16px}
.badge{width:64px;height:64px;border-radius:var(--radius-badge);display:block}
.wm{font-family:var(--font-display);font-size:34px;letter-spacing:1px;line-height:1}
.wm small{display:block;font-family:var(--font-sans);font-weight:600;font-size:14px;letter-spacing:4px;opacity:.75;margin-top:6px}

.post{background:var(--forest);color:var(--white)}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--forest-stripe-a) 0 var(--stripe),var(--forest-stripe-b) var(--stripe) calc(var(--stripe)*2))}
.c{position:absolute;inset:240px var(--safe-statement) 300px;display:flex;flex-direction:column}
.kick{font-weight:800;letter-spacing:6px;color:var(--leaf);font-size:24px}
h1{font-family:var(--font-display);font-weight:400;font-size:170px;line-height:.9;margin-top:var(--gap-s);text-transform:uppercase}
h1 span{color:var(--leaf)}
p{font-size:36px;line-height:1.35;margin-top:36px;color:var(--sage);max-width:860px}
.sticker{margin-top:72px;height:380px;border:3px dashed var(--rule-on-forest);display:grid;place-items:center;font-weight:600;font-size:20px;letter-spacing:4px;color:var(--rule-on-forest)}
.render .guide{visibility:hidden}
.foot{margin-top:auto;display:flex;justify-content:center}</style>
