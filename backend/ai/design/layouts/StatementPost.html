<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:var(--font-sans)}
.post.size-story{height:1920px}.post.size-square{height:1080px}
.mark{display:flex;align-items:center;gap:16px}
.badge{width:64px;height:64px;border-radius:var(--radius-badge);display:block}
.wm{font-family:var(--font-display);font-size:34px;letter-spacing:1px;line-height:1}
.wm small{display:block;font-family:var(--font-sans);font-weight:600;font-size:14px;letter-spacing:4px;opacity:.75;margin-top:6px}

.post{background:var(--forest);color:var(--white)}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--forest-stripe-a) 0 var(--stripe),var(--forest-stripe-b) var(--stripe) calc(var(--stripe)*2))}
.photo{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;inset:0;background:var(--forest);opacity:.72}
.c{position:absolute;inset:var(--safe-statement);display:flex;flex-direction:column}
.kick{font-weight:800;letter-spacing:6px;color:var(--leaf);font-size:22px}
h1{font-family:var(--font-display);font-weight:400;font-size:230px;line-height:.88;margin-top:28px;text-transform:uppercase}
h1 span{color:var(--leaf)}
p{font-size:34px;line-height:1.35;margin-top:var(--gap-l);max-width:780px;color:var(--sage)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid var(--rule-on-forest);padding-top:var(--gap-m)}
.cta{text-align:right;font-family:var(--font-display);font-size:52px;letter-spacing:1px;line-height:1}
.cta small{display:block;font-family:var(--font-sans);font-weight:600;font-size:18px;letter-spacing:4px;color:var(--leaf);margin-bottom:8px}
.size-story .c{inset:220px var(--safe-statement) 300px}
.size-story .head{margin:auto 0}
.size-square h1{font-size:180px}
.size-square p{font-size:30px}</style>
