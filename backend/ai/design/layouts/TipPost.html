<style>*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
.post{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:var(--font-sans)}
.post.size-story{height:1920px}.post.size-square{height:1080px}
.mark{display:flex;align-items:center;gap:16px}
.badge{width:64px;height:64px;border-radius:var(--radius-badge);display:block;border:5px solid var(--forest);background:var(--forest)}
.wm{font-family:var(--font-display);font-size:34px;letter-spacing:1px;line-height:1}
.wm small{display:block;font-family:var(--font-sans);font-weight:600;font-size:14px;letter-spacing:4px;opacity:.75;margin-top:6px}

.post{background:var(--leaf);color:var(--leaf-ink)}
.c{position:absolute;inset:90px;display:flex;flex-direction:column}
.num{font-family:var(--font-display);font-size:420px;line-height:.8;color:var(--forest)}
.kick{font-weight:800;letter-spacing:6px;font-size:22px;margin-top:30px}
h1{font-family:var(--font-display);font-weight:400;font-size:120px;line-height:.95;text-transform:uppercase;margin-top:var(--gap-s)}
p{font-size:30px;line-height:1.45;margin-top:30px;max-width:820px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--forest)}
.cta{font-weight:800;font-size:24px;letter-spacing:1px}
.size-story .c{inset:240px 90px 320px}
.size-story .head{margin:auto 0}
.size-square .c{inset:80px}
.size-square .num{font-size:300px}
.size-square h1{font-size:100px}
.size-square p{font-size:27px}</style>
